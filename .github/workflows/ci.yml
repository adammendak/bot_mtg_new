name: CI

on:
  pull_request:
  push:
    branches: [main]

# Heroku GitHub integration deploys bot-reinvented from main.

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Unit tests
        run: mvn -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/bot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/bot/package-lock.json
      - name: Install
        run: npm ci
      - name: Unit tests
        run: npm test -- --watch=false
      - name: Production build
        run: npm run build
      - name: Dependency audit (high+)
        # Advisory: surfaces vulnerable npm deps on every PR without hard-blocking
        # merges on a single transitive advisory. Drop continue-on-error to enforce.
        continue-on-error: true
        run: npm audit --audit-level=high
