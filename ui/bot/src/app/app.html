<header>
  <h1>SDD-M15</h1>

    <nav>
      <a routerLink="/">Dashboard</a>
      <a routerLink="/signals">Signals</a>
      <a routerLink="/history">History</a>

    <span class="user">{{ auth.user() }}</span>

  }
</header>

</main>
