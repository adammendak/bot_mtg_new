<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>BOT-reinvented</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#212529">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- CDN so packaged Heroku Angular still looks like PR #3 if the hashed bundle 404s. No SRI — a bad hash blocks CSS. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('https')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {
          /* SW is a progressive enhancement; failure must never block the app */
        });
      });
    }
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
