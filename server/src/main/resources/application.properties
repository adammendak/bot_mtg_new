spring.application.name=sdd-m15

# Heroku sets PORT. Local default 8080.
server.port=${PORT:8080}

# Local default is H2. When DATABASE_URL is set (Heroku Postgres),
# HerokuDatabaseEnvironmentPostProcessor switches to PostgreSQL, splits
# user/password out of the JDBC URL (never log the raw URL), sets the
# Postgres driver/dialect, and ddl-auto=none (Liquibase owns schema).
spring.datasource.url=jdbc:h2:mem:botdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console is local/dev only. Heroku DATABASE_URL disables it.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# OAuth2 client stays on the classpath but is unused. Dashboard and /api/**
# are permitAll so an unfinished login cannot block the bot. See README.

# Broker SPI: capital (default live adapter) or paper (in-process stub).
app.broker=${BROKER:capital}
app.execution-enabled=${EXECUTION_ENABLED:false}
app.timezone=${TZ:Europe/Warsaw}

# Comma-separated webhook URLs. Empty = no push.
app.webhook-urls=${AGENT_SIGNAL_WEBHOOK_URLS:}
# Sender key for Cursor automation webhooks (crsr_…). Empty = no auth header.
# Set on the host (Heroku config); never commit the value.
app.webhook-secret=${AGENT_SIGNAL_WEBHOOK_SECRET:}

# Telegram alerts (fill / 2R / day halt / scan failure). Empty = notifications off.
app.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram-chat-id=${TELEGRAM_CHAT_ID:}

# Spring 6-field cron (second minute hour day month weekday). Default: every M15
# close, all hours, all week. Timezone Europe/Warsaw. Override with SCAN_CRON.
# ScanService then filters the universe: Mon–Fri all SDD names; Sat/Sun BTC only.
app.scan.cron=${SCAN_CRON:0 1,16,31,46 * * * *}
app.scan.zone=${TZ:Europe/Warsaw}
# SDD-M15 is archived for the HTS forward test. SCAN_ENABLED=false stops the
# scheduled scan (code and endpoints stay; a manual POST /api/scan still works).
app.scan.enabled=${SCAN_ENABLED:false}

# SDD-SWING (H1) scan: 1 minute past every hour (H1 close), same zone as the M15
# scan. Persists signals to swing_signals and e-mails them.
app.swing.cron=${SWING_CRON:0 1 * * * *}
# SDD-SWING is archived for the HTS forward test — SWING_ENABLED=false stops the
# scheduled scan (code and endpoints stay).
app.swing.enabled=${SWING_ENABLED:false}
# Swing execution places entries on the `swing` book (a DEMO account) — off by
# default. Independent of EXECUTION_ENABLED (which is SDD-M15 on demo/live).
app.swing.execution-enabled=${SWING_EXECUTION_ENABLED:false}

# HTS ("wstęgi") scan: every 5 minutes so the FAST (H1/M5) model acts on the M5
# close; CORE (H4/M15) and SWING (D1/H1) re-check their last closed bar and the
# execution gate de-dupes per bar. Runs the 3 timeframe models, one per demo
# account (CORE→"Account m15", SWING→"Account H1", FAST→"Account m5").
app.hts.cron=${HTS_CRON:0 */5 * * * *}
# Master on/off for the whole HTS scan (all variants). Also togglable at runtime
# via the `hts.scan` feature flag in the admin panel (E-6).
app.hts.scan-enabled=${HTS_SCAN_ENABLED:true}
# HTS execution places entries on each variant's demo book — off by default.
# Independent of EXECUTION_ENABLED and SWING_EXECUTION_ENABLED.
app.hts.execution-enabled=${HTS_EXECUTION_ENABLED:true}
# CORE_LIVE variant only: HTS H4/M15 on the `live` book ("bot trading konto"),
# REAL MONEY, 1% of account risk. Separate flag so demo HTS can run without live.
app.hts.live-execution-enabled=${HTS_LIVE_EXECUTION_ENABLED:true}
# HTS position monitor (E-1): one position per signal, half off at TP1 (1:2 R:R),
# the runner trails the fast band and closes on a body beyond the slow band.
# Runs 30 s into every 5-min slot, just after the scan.
app.hts.monitor-enabled=${HTS_MONITOR_ENABLED:true}
app.hts.monitor-cron=${HTS_MONITOR_CRON:30 */5 * * * *}
# Weekend gap guard — FAST (H1/M5, konto m5) only: Friday evening close every
# open non-BTC position on the `hts` book. CORE (H4/M15) and SWING (D1/H1) hold
# through the weekend by design; BTC trades 24/7. Toggle via the
# `hts.weekend-flatten` feature flag.
app.hts.weekend-flatten-enabled=${HTS_WEEKEND_FLATTEN_ENABLED:true}
app.hts.weekend-flatten-cron=${HTS_WEEKEND_FLATTEN_CRON:0 45 21 * * FRI}
# The scan re-emits the same signal every cycle while the setup holds; mail one
# per variant|symbol|direction, then suppress for this many minutes.
app.hts.signal-mail-cooldown-minutes=${HTS_SIGNAL_MAIL_COOLDOWN_MINUTES:120}
# E-12: cotygodniowy przegląd AI mailem (poniedziałek rano). Opt-in — wymaga
# ANTHROPIC_API_KEY. Bez klucza lub przy AI_REVIEW_ENABLED=false = no-op.
app.hts.ai-review-enabled=${AI_REVIEW_ENABLED:false}
app.hts.ai-review-cron=${AI_REVIEW_CRON:0 30 7 * * MON}
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}
# Observability (E-5): dead-man switch over the scheduler heartbeats. The
# watchdog mails (throttled) + logs an error_event when a scheduler has had no
# successful cycle within its healthy window. HEALTHCHECK_URL, if set, is pinged
# on every successful HTS scan so an external monitor catches a whole-dyno death.
app.ops.watchdog-enabled=${OPS_WATCHDOG_ENABLED:true}
app.ops.watchdog-ms=${OPS_WATCHDOG_MS:300000}
app.ops.healthcheck-url=${HEALTHCHECK_URL:}
app.ops.error-retention-days=${OPS_ERROR_RETENTION_DAYS:30}
# Auth (E-7): bearer tokens now expire. Absolute lifetime + a sliding idle
# window that resets on each authenticated request. TOTP 2FA for admin sign-in
# uses this issuer label in the authenticator app.
app.auth.token-ttl-hours=${AUTH_TOKEN_TTL_HOURS:168}
app.auth.token-idle-hours=${AUTH_TOKEN_IDLE_HOURS:24}
app.auth.totp-issuer=${AUTH_TOTP_ISSUER:BOT-reinvented}

# Recipient for swing-signal e-mails.
app.mail.to=${MAIL_TO:adam.mendak@gmail.com}
app.mail.from=${MAIL_FROM:adam.mtg.bot@gmail.com}
# SMTP is OFF unless SPRING_MAIL_HOST is set on the host (then also
# SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD — for Gmail an App Password).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Equity history sync: how many days back to walk the broker transaction feed
# (in 7-day windows). Capital.com only keeps a short history and rate-limits the
# paging, so an unbounded backfill fails the whole sync. Raise only if the broker
# starts retaining more.
app.history-sync.max-lookback-days=${HISTORY_SYNC_LOOKBACK_DAYS:400}
# Per-book wall-clock cap on the transaction-history walk. Capital.com 429s the
# paging hard; without this a rate-limit storm makes /api/history/sync outlast
# Heroku's 30s router timeout (503). The walk returns what it got; the next run
# continues. /sync-all has its own overall cap on top of this.
app.history-sync.walk-budget-seconds=${HISTORY_SYNC_WALK_BUDGET_SECONDS:18}

# Actuator: health only. Details off so datasource URLs never leak.
# DB ping is not required for UP — a Postgres blip must not fail Heroku checks.
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=false

app.capital.demo.api-key=${CAPITAL_DEMO_API_KEY:${CAPITAL_API_KEY:}}
app.capital.demo.email=${CAPITAL_DEMO_EMAIL:${CAPITAL_EMAIL:}}
app.capital.demo.password=${CAPITAL_DEMO_API_PASSWORD:${CAPITAL_API_PASSWORD:}}
app.capital.demo.host=${CAPITAL_DEMO_HOST:https://demo-api-capital.backend-capital.com}

app.capital.live.api-key=${CAPITAL_LIVE_API_KEY:}
app.capital.live.email=${CAPITAL_LIVE_EMAIL:${CAPITAL_EMAIL:}}
app.capital.live.password=${CAPITAL_LIVE_PASSWORD:${CAPITAL_LIVE_API_PASSWORD:}}
app.capital.live.host=${CAPITAL_LIVE_HOST:https://api-capital.backend-capital.com}

# "Główne" (main) account — separate API key/password, same email as CAPITAL_EMAIL.
app.capital.glowne.api-key=${CAPITAL_GLOWNE_API_KEY:}
app.capital.glowne.email=${CAPITAL_GLOWNE_EMAIL:${CAPITAL_EMAIL:}}
app.capital.glowne.password=${CAPITAL_GLOWNE_PASSWORD:}
app.capital.glowne.host=${CAPITAL_GLOWNE_HOST:https://api-capital.backend-capital.com}

# "Swing" — a separate Capital.com DEMO account reserved for the SDD-SWING (H1)
# strategy. Empty until CAPITAL_SWING_* is set (the book then shows disconnected).
app.capital.swing.api-key=${CAPITAL_SWING_API_KEY:}
app.capital.swing.email=${CAPITAL_SWING_EMAIL:${CAPITAL_EMAIL:}}
app.capital.swing.password=${CAPITAL_SWING_PASSWORD:${CAPITAL_SWING_API_PASSWORD:}}
app.capital.swing.host=${CAPITAL_SWING_HOST:https://demo-api-capital.backend-capital.com}

# "HTS" — a separate Capital.com DEMO account reserved for the HTS ("wstęgi")
# strategy (3rd book). Empty until CAPITAL_HTS_* is set (the book then shows disconnected).
app.capital.hts.api-key=${CAPITAL_HTS_API_KEY:}
app.capital.hts.email=${CAPITAL_HTS_EMAIL:${CAPITAL_EMAIL:}}
app.capital.hts.password=${CAPITAL_HTS_PASSWORD:${CAPITAL_HTS_API_PASSWORD:}}
app.capital.hts.host=${CAPITAL_HTS_HOST:https://demo-api-capital.backend-capital.com}

# OKX (crypto exchange) — the `okx` book: SWAP (perpetual) instruments, HTS scan +
# execution. Auth per request: API key + secret + passphrase (HMAC-SHA256). Empty
# until OKX_* is set (the book then shows disconnected; HTS skips execution).
# OKX_DEMO=true adds the x-simulated-trading: 1 header (demo trading, openapi.okx.com).
app.okx.api-key=${OKX_API_KEY:}
app.okx.secret=${OKX_SECRET:}
app.okx.passphrase=${OKX_PASSPHRASE:}
app.okx.host=${OKX_HOST:}
# OKX runs real money (no usable demo for this account). OKX_DEMO=true would add
# x-simulated-trading:1 for the demo environment.
app.okx.demo=${OKX_DEMO:false}
# Real-money OKX arm switch: CORE_OKX/FAST_OKX carry live=false, so this must be
# explicitly true before they place any order. They still get a day-P/L halt.
app.okx.live-execution-enabled=${OKX_LIVE_EXECUTION_ENABLED:false}

app.live-account-name=${LIVE_ACCOUNT_NAME:bot trading konto}
# "Główne" (main) account name on Capital.com — pins the account the glowne book
# reads and snapshots. Defaults to "Glowne".
app.glowne-account-name=${GLOWNE_ACCOUNT_NAME:Glowne}
# Capital.com DEMO sub-account the `swing` book reads / trades. "Account" is the
# SDD-M15 demo account; the swing strategy runs on a separate one.
app.swing-account-name=${SWING_ACCOUNT_NAME:Account H1}
# There are now several demo sub-accounts on one login (Account m15 / Account H1 /
# Account m5). Pin the SDD-M15 demo account by name so it is not cross-picked.
app.demo-account-name=${DEMO_ACCOUNT_NAME:Account m15}
# Capital.com DEMO sub-account for the HTS strategy (3rd book).
app.hts-account-name=${HTS_ACCOUNT_NAME:Account m5}
app.live-equity-refuse=${LIVE_EQUITY_REFUSE:5000}
app.demo-risk-pln=${DEMO_RISK_PLN:10}
app.halt-pln=${HALT_PLN:-30}
app.hard-halt-pln=${HARD_HALT_PLN:-50}
app.live-halt-pln=${LIVE_HALT_PLN:-18}
app.min-deal-size=${MIN_DEAL_SIZE:0.01}
app.hts-margin-buffer=${HTS_MARGIN_BUFFER:0.8}
app.max-open-names=${MAX_OPEN_NAMES:4}

# Fail-open if the calendar cannot be fetched.
app.news-calendar-url=${NEWS_CALENDAR_URL:https://nfs.faireconomy.media/ff_calendar_thisweek.json}

# Capital.com epics for the SDD universe (not STONKS, not US30).
# BTC uses BTCUSD — BITCOIN 404s on Capital.com (error.not-found.epic).
app.sdd.epics.ger40=${SDD_EPIC_GER40:DE40}
app.sdd.epics.xau=${SDD_EPIC_XAU:GOLD}
app.sdd.epics.us100=${SDD_EPIC_US100:US100}
app.sdd.epics.eurusd=${SDD_EPIC_EURUSD:EURUSD}
app.sdd.epics.btc=${SDD_EPIC_BTC:BTCUSD}
