spring.application.name=sdd-m15

# Heroku sets PORT. Local default 8080.
server.port=${PORT:8080}

# Local default is H2. When DATABASE_URL is set (Heroku Postgres),
# HerokuDatabaseEnvironmentPostProcessor switches to PostgreSQL, splits
# user/password out of the JDBC URL (never log the raw URL), sets the
# Postgres driver/dialect, and ddl-auto=none (Liquibase owns schema).
spring.datasource.url=jdbc:h2:mem:botdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console is local/dev only. Heroku DATABASE_URL disables it.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# OAuth2 client stays on the classpath but is unused. Dashboard and /api/**
# are permitAll so an unfinished login cannot block the bot. See README.

# Broker SPI: capital (default live adapter) or paper (in-process stub).
app.broker=${BROKER:capital}
app.execution-enabled=${EXECUTION_ENABLED:false}
app.timezone=${TZ:Europe/Warsaw}

# Comma-separated webhook URLs. Empty = no push.
app.webhook-urls=${AGENT_SIGNAL_WEBHOOK_URLS:}
# Sender key for Cursor automation webhooks (crsr_…). Empty = no auth header.
# Set on the host (Heroku config); never commit the value.
app.webhook-secret=${AGENT_SIGNAL_WEBHOOK_SECRET:}

# Telegram alerts (fill / 2R / day halt / scan failure). Empty = notifications off.
app.telegram-bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram-chat-id=${TELEGRAM_CHAT_ID:}

# Spring 6-field cron (second minute hour day month weekday). Default: every M15
# close, all hours, all week. Timezone Europe/Warsaw. Override with SCAN_CRON.
# ScanService then filters the universe: Mon–Fri all SDD names; Sat/Sun BTC only.
app.scan.cron=${SCAN_CRON:0 1,16,31,46 * * * *}
app.scan.zone=${TZ:Europe/Warsaw}

# SDD-SWING (H1) scan: 1 minute past every hour (H1 close), same zone as the M15
# scan. Persists signals to swing_signals and e-mails them.
app.swing.cron=${SWING_CRON:0 1 * * * *}
# Swing execution places entries on the `swing` book (a DEMO account) — off by
# default. Independent of EXECUTION_ENABLED (which is SDD-M15 on demo/live).
app.swing.execution-enabled=${SWING_EXECUTION_ENABLED:false}
# Which Capital.com sub-account (by name) swing trades on. Default "Account".
app.swing.account-name=${SWING_ACCOUNT_NAME:Account}
# Recipient for swing-signal e-mails.
app.mail.to=${MAIL_TO:adam.mendak@gmail.com}
app.mail.from=${MAIL_FROM:adam.mtg.bot@gmail.com}
# SMTP is OFF unless SPRING_MAIL_HOST is set on the host (then also
# SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD — for Gmail an App Password).
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Equity history sync: how many days back to walk the broker transaction feed
# (in 7-day windows). Capital.com only keeps a short history and rate-limits the
# paging, so an unbounded backfill fails the whole sync. Raise only if the broker
# starts retaining more.
app.history-sync.max-lookback-days=${HISTORY_SYNC_LOOKBACK_DAYS:400}

# Actuator: health only. Details off so datasource URLs never leak.
# DB ping is not required for UP — a Postgres blip must not fail Heroku checks.
management.endpoints.web.exposure.include=health
management.endpoints.jmx.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.health.db.enabled=false

app.capital.demo.api-key=${CAPITAL_DEMO_API_KEY:${CAPITAL_API_KEY:}}
app.capital.demo.email=${CAPITAL_DEMO_EMAIL:${CAPITAL_EMAIL:}}
app.capital.demo.password=${CAPITAL_DEMO_API_PASSWORD:${CAPITAL_API_PASSWORD:}}
app.capital.demo.host=${CAPITAL_DEMO_HOST:https://demo-api-capital.backend-capital.com}

app.capital.live.api-key=${CAPITAL_LIVE_API_KEY:}
app.capital.live.email=${CAPITAL_LIVE_EMAIL:${CAPITAL_EMAIL:}}
app.capital.live.password=${CAPITAL_LIVE_PASSWORD:${CAPITAL_LIVE_API_PASSWORD:}}
app.capital.live.host=${CAPITAL_LIVE_HOST:https://api-capital.backend-capital.com}

# "Główne" (main) account — separate API key/password, same email as CAPITAL_EMAIL.
app.capital.glowne.api-key=${CAPITAL_GLOWNE_API_KEY:}
app.capital.glowne.email=${CAPITAL_GLOWNE_EMAIL:${CAPITAL_EMAIL:}}
app.capital.glowne.password=${CAPITAL_GLOWNE_PASSWORD:}
app.capital.glowne.host=${CAPITAL_GLOWNE_HOST:https://api-capital.backend-capital.com}

# "Swing" — a separate Capital.com DEMO account reserved for the SDD-SWING (H1)
# strategy. Empty until CAPITAL_SWING_* is set (the book then shows disconnected).
app.capital.swing.api-key=${CAPITAL_SWING_API_KEY:}
app.capital.swing.email=${CAPITAL_SWING_EMAIL:${CAPITAL_EMAIL:}}
app.capital.swing.password=${CAPITAL_SWING_PASSWORD:${CAPITAL_SWING_API_PASSWORD:}}
app.capital.swing.host=${CAPITAL_SWING_HOST:https://demo-api-capital.backend-capital.com}

app.live-account-name=${LIVE_ACCOUNT_NAME:bot trading konto}
# "Główne" (main) account name on Capital.com — pins the account the glowne book
# reads and snapshots. Defaults to "Glowne".
app.glowne-account-name=${GLOWNE_ACCOUNT_NAME:Glowne}
app.live-equity-refuse=${LIVE_EQUITY_REFUSE:5000}
app.demo-risk-pln=${DEMO_RISK_PLN:10}
app.halt-pln=${HALT_PLN:-30}
app.hard-halt-pln=${HARD_HALT_PLN:-50}
app.live-halt-pln=${LIVE_HALT_PLN:-18}
app.min-deal-size=${MIN_DEAL_SIZE:0.01}
app.max-open-names=${MAX_OPEN_NAMES:4}

# Fail-open if the calendar cannot be fetched.
app.news-calendar-url=${NEWS_CALENDAR_URL:https://nfs.faireconomy.media/ff_calendar_thisweek.json}

# Capital.com epics for the SDD universe (not STONKS, not US30).
# BTC uses BTCUSD — BITCOIN 404s on Capital.com (error.not-found.epic).
app.sdd.epics.ger40=${SDD_EPIC_GER40:DE40}
app.sdd.epics.xau=${SDD_EPIC_XAU:GOLD}
app.sdd.epics.us100=${SDD_EPIC_US100:US100}
app.sdd.epics.eurusd=${SDD_EPIC_EURUSD:EURUSD}
app.sdd.epics.btc=${SDD_EPIC_BTC:BTCUSD}
