# ============================================================
# Production profile. The database connection is taken from the
# DATABASE_URL environment variable (set by Heroku) — the raw URL
# with credentials is NEVER committed to this repo.
#
# HerokuDatabaseEnvironmentPostProcessor switches H2 -> PostgreSQL
# automatically when DATABASE_URL is present and applies sslmode=require.
# Failing to provide DATABASE_URL makes startup refuse (fail-fast),
# so production can never silently run on the local H2.
# ============================================================

spring.datasource.url=${DATABASE_URL}

# Broker stays live-capital by default; execution is opt-in via env.
app.broker=${BROKER:capital}
app.execution-enabled=${EXECUTION_ENABLED:false}
