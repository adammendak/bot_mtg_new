# ============================================================
# Local dev profile: in-memory H2 + historical data seed
# Run with:  BROKER=paper ./mvnw -pl server spring-boot:run -Dspring-boot.run.profiles=dev
#
# H2 in-memory: fresh DB every start, no file locks, no stale password issues.
# The DevDataSeeder fills it with ~2y of history so the dashboard has data
# for performance checks. (In-memory DB dies with the process.)
# ============================================================

# In-memory H2 — nothing is persisted, no locks, no auth problems.
spring.datasource.url=jdbc:h2:mem:botdev;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Seeder config — generates historical data for performance checks (DevDataSeeder).
app.seed.enabled=true
app.seed.days=730
app.seed.intraday-per-day=0
app.seed.demo-start=10000
app.seed.live-start=437
app.seed.signal-per-day-max=3
