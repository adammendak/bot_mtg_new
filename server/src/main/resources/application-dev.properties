# ============================================================
# Local dev profile: persistent H2 file DB + historical data seed
# Run with:  BROKER=paper ./mvnw -pl server spring-boot:run -Dspring-boot.run.profiles=dev
# The H2 file survives restarts and is connectable from IntelliJ:
#   URL:  jdbc:h2:file:<absolute path to server>/data/botdev;AUTO_SERVER=TRUE
#   User: sa   Pass: (empty)
# ============================================================

# Persistent file-based H2 (not in-memory) so seeded data survives restarts.
# AUTO_SERVER=TRUE lets IntelliJ / external tools open the same DB while the app runs.
# (Note: AUTO_SERVER cannot be combined with DB_CLOSE_ON_EXIT=FALSE — H2 rejects it.)
spring.datasource.url=jdbc:h2:file:./data/botdev;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Seeder config — generates historical data for performance checks (DevDataSeeder).
app.seed.enabled=true
app.seed.days=730
app.seed.intraday-per-day=0
app.seed.demo-start=10000
app.seed.live-start=437
app.seed.signal-per-day-max=3
